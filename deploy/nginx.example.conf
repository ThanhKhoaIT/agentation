# For servers already running Nginx. Replace the domain and certificate paths
# (e.g. from certbot), then include this file in your Nginx config.
server {
    listen 443 ssl http2;
    server_name feedback.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/feedback.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.your-domain.com/privkey.pem;

    # Annotations can include element styles; the server itself caps bodies at 2MB
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4747;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-sent events: no buffering, keep the connection open
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name feedback.your-domain.com;
    return 301 https://$host$request_uri;
}
