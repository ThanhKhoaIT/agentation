<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Feedback</title>
    <style>
      :root {
        --ink: #1b2433;
        --muted: #667085;
        --faint: #98a2b3;
        --line: #e4e8ee;
        --surface: #f5f7fa;
        --bg: #ffffff;
        --accent: #0a7cff;
        --accent-hover: #006ae0;
        --accent-soft: #e7f1ff;
        --ok: #1e8e5a;
        --ok-soft: #e6f5ee;
        --warn: #b86e00;
        --warn-soft: #fdf3e2;
        --off: #98a2b3;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e6e9ef;
          --muted: #9aa3b2;
          --faint: #6b7483;
          --line: #2a303b;
          --surface: #1c2129;
          --bg: #14181e;
          --accent: #4c9dff;
          --accent-hover: #6aaeff;
          --accent-soft: #1a2a40;
          --ok: #4cc38a;
          --ok-soft: #16291f;
          --warn: #e0a13a;
          --warn-soft: #2e2415;
          --off: #6b7483;
          color-scheme: dark;
        }
      }

      * { box-sizing: border-box; }

      body {
        width: 340px;
        margin: 0;
        font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      button, input { font: inherit; color: inherit; }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }

      svg.icon {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Page identity */
      .page {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 18px 18px 14px;
      }

      .favicon {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: var(--surface);
        display: grid;
        place-items: center;
        color: var(--faint);
        overflow: hidden;
      }

      .favicon img { width: 20px; height: 20px; }

      .page-text { min-width: 0; }

      .page-name {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .page-title {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .gear {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 8px;
        background: none;
        color: var(--faint);
        cursor: pointer;
      }

      .gear:hover, .gear[aria-expanded="true"] { color: var(--ink); background: var(--surface); }

      /* The status card: the one thing the popup is for */
      .status {
        margin: 0 18px;
        padding: 14px;
        border-radius: 12px;
        background: var(--surface);
        display: grid;
        grid-template-columns: 20px 1fr auto;
        gap: 4px 10px;
        align-items: start;
      }

      .status .glyph { margin-top: 1px; width: 20px; height: 20px; }

      .status-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .status-text {
        grid-column: 2 / 4;
        margin: 0;
        color: var(--muted);
      }

      .status.on { background: var(--ok-soft); }
      .status.on .glyph { color: var(--ok); }
      .status.paused .glyph { color: var(--off); }
      .status.blocked .glyph, .status.problem .glyph { color: var(--warn); }
      .status.problem { background: var(--warn-soft); }
      .status.loading .glyph { color: var(--faint); }

      /* Switch */
      .switch {
        position: relative;
        width: 38px;
        height: 22px;
        flex: none;
      }

      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .switch .track {
        position: absolute;
        inset: 0;
        border-radius: 11px;
        background: var(--line);
        transition: background 0.2s;
        pointer-events: none;
      }

      .switch .track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.2);
        transition: transform 0.2s;
      }

      .switch input:checked + .track { background: var(--ok); }
      .switch input:checked + .track::after { transform: translateX(16px); }
      .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Main action */
      .actions { padding: 14px 18px 18px; }

      .primary {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 14px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

      .primary:hover { background: var(--accent-hover); }

      .primary .badge {
        min-width: 20px;
        padding: 0 6px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.22);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .secondary {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        font-weight: 600;
        cursor: pointer;
      }

      .secondary:hover { background: var(--surface); }

      /* Settings (only when not managed by the organization) */
      .settings {
        margin: 0 18px 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .settings-intro {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .field { display: grid; gap: 4px; margin-bottom: 10px; }

      .field label { font-size: 12px; font-weight: 550; }

      .field input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        font-size: 13px;
        outline: none;
      }

      .field input:focus { border-color: var(--accent); }

      .settings-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .settings-row .secondary { width: auto; padding: 8px 14px; }

      .saved {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--ok);
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .saved.visible { opacity: 1; }
      .saved svg.icon { width: 14px; height: 14px; }

      .hidden { display: none !important; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-on" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="m9 10.5 2 2 4-4"/></symbol>
      <symbol id="i-paused" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M10 9v4M14 9v4"/></symbol>
      <symbol id="i-blocked" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></symbol>
      <symbol id="i-problem" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></symbol>
      <symbol id="i-loading" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="4 4"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    </svg>

    <div class="page">
      <div class="favicon" id="favicon"></div>
      <div class="page-text">
        <h1 class="page-name" id="page-name">This page</h1>
        <div class="page-title" id="page-title"></div>
      </div>
      <button class="gear hidden" id="gear" aria-expanded="false" aria-controls="settings" title="Connection settings">
        <svg class="icon"><use href="#i-gear"/></svg>
      </button>
    </div>

    <section class="status loading" id="status" aria-live="polite">
      <svg class="icon glyph" id="status-glyph"><use href="#i-loading"/></svg>
      <p class="status-title" id="status-title">Checking this site…</p>
      <label class="switch hidden" id="switch" title="Show the feedback button on this site">
        <input type="checkbox" id="enabled" aria-label="Show the feedback button on this site">
        <span class="track"></span>
      </label>
      <p class="status-text" id="status-text"></p>
    </section>

    <div class="actions">
      <button class="primary hidden" id="open-panel">
        <svg class="icon"><use href="#i-panel"/></svg>
        <span>View feedback</span>
        <span class="badge hidden" id="open-count"></span>
      </button>
      <button class="secondary hidden" id="retry">Try again</button>
    </div>

    <section class="settings hidden" id="settings">
      <p class="settings-intro">Your tech team gives you these details.</p>
      <div class="field">
        <label for="endpoint">Feedback service address</label>
        <input type="text" id="endpoint" placeholder="https://feedback.example.com" autocomplete="off">
      </div>
      <div class="field">
        <label for="ingest-auth">Access key</label>
        <input type="password" id="ingest-auth" placeholder="Leave empty if you don't have one" autocomplete="off">
      </div>
      <div class="settings-row">
        <button class="secondary" id="save">Save</button>
        <span class="saved" id="saved"><svg class="icon"><use href="#i-check"/></svg>Saved</span>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
